<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">UsVault</title>
  <desc id="desc">UsVault, a private memory vault for two: daily memories, moods and live status, shared only with your partner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1748"/>
      <stop offset="0.45" stop-color="#5b2c8f"/>
      <stop offset="0.75" stop-color="#b8487a"/>
      <stop offset="1" stop-color="#3a2a78"/>
    </linearGradient>
    <linearGradient id="title-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f6dcff"/>
      <stop offset="1" stop-color="#ffd1e3"/>
    </linearGradient>
    <radialGradient id="orb-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8fbf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8fbf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a58bff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a58bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="28"/>
    </clipPath>
    <path id="heart" d="M0 6 C0 -2 10 -6 14 2 C18 -6 28 -2 28 6 C28 15 14 24 14 24 C14 24 0 15 0 6 Z"/>
  </defs>

  <style>
    .shift { animation: shift 14s ease-in-out infinite alternate; transform-origin: center; }
    .orb-a { animation: drift-a 11s ease-in-out infinite alternate; }
    .orb-b { animation: drift-b 13s ease-in-out infinite alternate; }
    .title { animation: rise 1.1s cubic-bezier(.22,1,.36,1) both, glow 4.5s ease-in-out 1.2s infinite alternate; }
    .tagline { animation: rise 1.1s cubic-bezier(.22,1,.36,1) .35s both; }
    .chips { animation: rise 1.1s cubic-bezier(.22,1,.36,1) .7s both; }
    .lock { animation: rise 1s cubic-bezier(.22,1,.36,1) .15s both; }
    .lock-heart { animation: beat 2.4s ease-in-out 1.4s infinite; transform-origin: 1007px 166px; }
    .float { animation: float 7s ease-in-out infinite; }
    .f2 { animation-delay: -2.3s; animation-duration: 8.5s; }
    .f3 { animation-delay: -4.1s; animation-duration: 6.2s; }
    .f4 { animation-delay: -1.2s; animation-duration: 9s; }

    @keyframes shift { from { transform: translateX(-90px) scale(1.15); } to { transform: translateX(90px) scale(1.15); } }
    @keyframes drift-a { from { transform: translate(0, 0); } to { transform: translate(120px, 30px); } }
    @keyframes drift-b { from { transform: translate(0, 0); } to { transform: translate(-140px, -20px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes glow { from { filter: drop-shadow(0 0 0 rgba(255, 170, 220, 0)); } to { filter: drop-shadow(0 0 14px rgba(255, 170, 220, .75)); } }
    @keyframes beat { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.14); } 24% { transform: scale(1); } 36% { transform: scale(1.1); } 48% { transform: scale(1); } }
    @keyframes float { 0%, 100% { transform: translateY(0); opacity: .35; } 50% { transform: translateY(-16px); opacity: .7; } }

    @media (prefers-reduced-motion: reduce) {
      .shift, .orb-a, .orb-b, .title, .tagline, .chips, .lock, .lock-heart, .float { animation: none !important; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect class="shift" x="-120" y="-40" width="1440" height="400" fill="url(#bg)"/>
    <circle class="orb-a" cx="230" cy="70" r="210" fill="url(#orb-a)"/>
    <circle class="orb-b" cx="980" cy="270" r="240" fill="url(#orb-b)"/>

    <!-- floating hearts -->
    <use href="#heart" class="float" x="36" y="262" fill="#ffc2dc"/>
    <use href="#heart" class="float f2" x="640" y="40" fill="#e5d4ff"/>
    <use href="#heart" class="float f3" x="1110" y="60" fill="#ffc2dc"/>
    <use href="#heart" class="float f4" x="820" y="262" fill="#e5d4ff"/>

    <!-- vault / lock mark -->
    <g class="lock">
      <rect x="922" y="96" width="170" height="150" rx="34" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".45" stroke-width="2"/>
      <path d="M967 112 v-22 a40 40 0 0 1 80 0 v22" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="10" stroke-linecap="round"/>
      <g class="lock-heart" filter="url(#glow)">
        <use href="#heart" x="993" y="154" fill="#ff7fb3" transform="translate(-14 -10) scale(1)"/>
      </g>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
      <text class="title" x="96" y="160" font-size="96" font-weight="800" letter-spacing="-2" fill="url(#title-fill)">UsVault</text>
      <text class="tagline" x="100" y="210" font-size="28" font-weight="500" fill="#f3e8ff" fill-opacity=".92">A private memory vault for two</text>
      <g class="chips" font-size="17" font-weight="600" fill="#ffffff">
        <rect x="100" y="236" width="170" height="38" rx="19" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".3"/>
        <text x="185" y="261" text-anchor="middle">Daily memories</text>
        <rect x="282" y="236" width="196" height="38" rx="19" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".3"/>
        <text x="380" y="261" text-anchor="middle">Mood + status sync</text>
        <rect x="490" y="236" width="236" height="38" rx="19" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".3"/>
        <text x="608" y="261" text-anchor="middle">Private to the two of you</text>
      </g>
    </g>
  </g>
</svg>
